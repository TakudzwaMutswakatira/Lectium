{% extends "base.html" %}

{% block content %}
    <div class="register-section">
        <h2>Join the Book Club</h2>
        
        <!-- The method must be POST to match the request.method check in your views.py -->
        <form method="POST">
            <!-- CSRF token is required by Django for security on all POST forms -->
            {% csrf_token %}
            
            <!-- This renders the CustomUserCreationForm from your views.py as paragraph tags -->
            {{ form.as_p }}
            
            <button type="submit">Sign Up</button>
        </form>

        <div class="login-prompt">
            <p>Already have an account? <a href="{% url 'login' %}">Log in here</a>.</p>
        </div>
    </div>
{% endblock content %}
