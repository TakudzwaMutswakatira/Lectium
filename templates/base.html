<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Librarium</title>
</head>
<body>
    <header>
        <h1>Librarium</h1>
        <nav>
            <a href="{% url 'clubs:club_list' %}">Book Clubs</a> |
            <a href="{% url 'books:book_list' %}">Books Catalog</a> |
            {% if user.is_authenticated %}
                <span>Logged in as: <strong>{{ user.username }}</strong> (Pace: {{ user.get_reading_pace_display }})</span> |
                <form method="post" action="{% url 'users:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'users:login' %}">Login</a> |
                <a href="{% url 'users:register' %}">Register</a>
            {% endif %}
        </nav>
        <hr>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
