<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club App</title>
</head>
<body>
    <header>
        <nav>
            <!-- These use the exact 'name' attributes from your urls.py -->
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    <main>
        <!-- This block catches and displays the success message from views.py -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <!-- Feature-specific templates will inject their HTML right here -->
        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
